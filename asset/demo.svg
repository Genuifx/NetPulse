<text x="24" y="64" font-family="monospace" font-size="13" fill="#c9d1d9">▸ 正在查询 IP 信息…</text><text x="24" y="83" font-family="monospace" font-size="13" fill="#c9d1d9">▸ 正在检测流媒体/AI 解锁…</text><text x="24" y="102" font-family="monospace" font-size="13" fill="#c9d1d9">▸ 正在测速…</text><text x="24" y="121" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="140" font-family="monospace" font-size="13" fill="#c9d1d9">  _   _      _   ____        _          </text><text x="24" y="159" font-family="monospace" font-size="13" fill="#c9d1d9"> | \ | | ___| |_|  _ \ _   _| |___  ___ </text><text x="24" y="178" font-family="monospace" font-size="13" fill="#c9d1d9"> |  \| |/ _ \ __| |_) | | | | / __|/ _ \</text><text x="24" y="197" font-family="monospace" font-size="13" fill="#c9d1d9"> | |\  |  __/ |_|  __/| |_| | \__ \  __/</text><text x="24" y="216" font-family="monospace" font-size="13" fill="#c9d1d9"> |_| \_|\___|\__|_|    \__,_|_|___/\___|</text><text x="24" y="235" font-family="monospace" font-size="13" fill="#c9d1d9">    </text><text x="24" y="254" font-family="monospace" font-size="13" fill="#c9d1d9">  NetPulse v0.2.0 · 一键服务器网络体检</text><text x="24" y="273" font-family="monospace" font-size="13" fill="#c9d1d9">  只检测目标机器的网络出口，不收集、不上传任何数据</text><text x="24" y="292" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="311" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="330" font-family="monospace" font-size="13" fill="#c9d1d9">━━ 1/4 · IP 信息 ━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="349" font-family="monospace" font-size="13" fill="#c9d1d9">  IP      : 203.0.113.10</text><text x="24" y="368" font-family="monospace" font-size="13" fill="#c9d1d9">  位置    : United States Indianapolis (America/Indiana/Indianapolis)</text><text x="24" y="387" font-family="monospace" font-size="13" fill="#c9d1d9">  ASN     : AS54113 Fastly, Inc.</text><text x="24" y="406" font-family="monospace" font-size="13" fill="#c9d1d9">  运营商  : Fastly, Inc.</text><text x="24" y="425" font-family="monospace" font-size="13" fill="#c9d1d9">  组织    : </text><text x="24" y="444" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="463" font-family="monospace" font-size="13" fill="#c9d1d9">━━ 2/4 · IP 纯净度 ━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="482" font-family="monospace" font-size="13" fill="#c9d1d9">  ✅ 结论：疑似家宽/原生 IP</text><text x="24" y="501" font-family="monospace" font-size="13" fill="#c9d1d9">  这是什么意思？机房 IP 适合建站/做节点，但部分平台（社交/电商/AI）风控更严；</text><text x="24" y="520" font-family="monospace" font-size="13" fill="#c9d1d9">  家宽/原生 IP 更&quot;干净&quot;，适合账号类、出海业务。</text><text x="24" y="539" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="558" font-family="monospace" font-size="13" fill="#c9d1d9">━━ 3/4 · 流媒体 / AI 解锁检测（初步） ━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="577" font-family="monospace" font-size="13" fill="#c9d1d9">  ✅ Netflix: 可访问（HTTP 200）</text><text x="24" y="596" font-family="monospace" font-size="13" fill="#c9d1d9">  ✅ Disney+: 可访问（HTTP 200）</text><text x="24" y="615" font-family="monospace" font-size="13" fill="#c9d1d9">  ✅ YouTube Premium: 可访问（HTTP 200）</text><text x="24" y="634" font-family="monospace" font-size="13" fill="#c9d1d9">  ✅ TikTok: 可访问（HTTP 200）</text><text x="24" y="653" font-family="monospace" font-size="13" fill="#c9d1d9">  ✅ ChatGPT: 可访问（HTTP 200）</text><text x="24" y="672" font-family="monospace" font-size="13" fill="#c9d1d9">  ❌ Gemini: 检测失败（超时或网络错误）</text><text x="24" y="691" font-family="monospace" font-size="13" fill="#c9d1d9">  说明：状态码只是初步判断，Netflix 等建议用专项脚本二次确认。</text><text x="24" y="710" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="729" font-family="monospace" font-size="13" fill="#c9d1d9">━━ 4/4 · 速度测试 ━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="748" font-family="monospace" font-size="13" fill="#c9d1d9">  Cloudflare: 34.7 Mbps 下载</text><text x="24" y="767" font-family="monospace" font-size="13" fill="#c9d1d9">  CacheFly: 18.9 Mbps 下载</text><text x="24" y="786" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="805" font-family="monospace" font-size="13" fill="#c9d1d9">━━ 体检总结 ━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="824" font-family="monospace" font-size="13" fill="#c9d1d9">  • 目标：local</text><text x="24" y="843" font-family="monospace" font-size="13" fill="#c9d1d9">  • IP 类型：疑似家宽/原生 IP</text><text x="24" y="862" font-family="monospace" font-size="13" fill="#c9d1d9">  • 解锁情况：5/6 个服务可访问</text><text x="24" y="881" font-family="monospace" font-size="13" fill="#c9d1d9">  • 下载速度：约 34.7 Mbps（取最优）</text><text x="24" y="900" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="919" font-family="monospace" font-size="13" fill="#c9d1d9">  ℹ️ IP 比较干净：适合账号类、出海业务。</text><text x="24" y="938" font-family="monospace" font-size="13" fill="#c9d1d9">  ℹ️ 流媒体/AI 解锁良好，拿来看剧或跑 AI 没压力。</text>
