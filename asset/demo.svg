<text x="110" y="27" font-family="monospace" font-size="14" fill="#8b949e">netpulse — 一键服务器网络体检（真实运行截图）</text>
<text x="24" y="64" font-family="monospace" font-size="13" fill="#c9d1d9">  ▸ 正在查询 IP 信息…</text><text x="24" y="83" font-family="monospace" font-size="13" fill="#c9d1d9">  ▸ 正在检测 DNS 泄露…</text><text x="24" y="102" font-family="monospace" font-size="13" fill="#c9d1d9">  ▸ 正在检测流媒体/AI 解锁…</text><text x="24" y="121" font-family="monospace" font-size="13" fill="#c9d1d9">  ▸ 正在检测 IPv6…</text><text x="24" y="140" font-family="monospace" font-size="13" fill="#c9d1d9">  ▸ 正在测试延迟…</text><text x="24" y="159" font-family="monospace" font-size="13" fill="#c9d1d9">  ▸ 正在测速…</text><text x="24" y="178" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="197" font-family="monospace" font-size="13" fill="#c9d1d9">  NetPulse  v0.3.0</text><text x="24" y="216" font-family="monospace" font-size="13" fill="#c9d1d9">  为 AI agent 而生的 VPS 巡检工具</text><text x="24" y="235" font-family="monospace" font-size="13" fill="#c9d1d9">  ────────────────────────────────────────────</text><text x="24" y="254" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="273" font-family="monospace" font-size="13" fill="#c9d1d9">  ━━ 1/5 · IP 信息  [local] ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="292" font-family="monospace" font-size="13" fill="#c9d1d9">    IP        203.0.113.10</text><text x="24" y="311" font-family="monospace" font-size="13" fill="#c9d1d9">    位置      United States · Atlanta (America/New_York)</text><text x="24" y="330" font-family="monospace" font-size="13" fill="#c9d1d9">    ASN       AS54113 Fastly, Inc.</text><text x="24" y="349" font-family="monospace" font-size="13" fill="#c9d1d9">    运营商    Fastly, Inc.</text><text x="24" y="368" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="387" font-family="monospace" font-size="13" fill="#c9d1d9">  ━━ 2/5 · IP 纯净度 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="406" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ 疑似家宽/原生 IP</text><text x="24" y="425" font-family="monospace" font-size="13" fill="#c9d1d9">    机房 IP 适合建站/做节点，但部分平台风控更严；家宽/原生 IP 更&quot;干净&quot;，适合账号类业务。</text><text x="24" y="444" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="463" font-family="monospace" font-size="13" fill="#c9d1d9">  ━━ 3/5 · DNS 泄露检测 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="482" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ 无泄露：解析出口 203.0.113.10（United States - Google LLC）</text><text x="24" y="501" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="520" font-family="monospace" font-size="13" fill="#c9d1d9">  ━━ 4/5 · 流媒体 / AI 解锁检测（10/11） ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="539" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ Netflix         可访问</text><text x="24" y="558" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ Disney+         可访问</text><text x="24" y="577" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ YouTube Premium 可访问</text><text x="24" y="596" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ HBO Max         可访问</text><text x="24" y="615" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ Hulu            可访问</text><text x="24" y="634" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ Prime Video     可访问</text><text x="24" y="653" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ TikTok          可访问</text><text x="24" y="672" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ Spotify         可访问</text><text x="24" y="691" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ ChatGPT         可访问</text><text x="24" y="710" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ Claude          可访问</text><text x="24" y="729" font-family="monospace" font-size="13" fill="#c9d1d9">    ✗ Gemini          检测失败</text><text x="24" y="748" font-family="monospace" font-size="13" fill="#c9d1d9">    状态码为初步判断，Netflix 等建议用专项脚本二次确认。</text><text x="24" y="767" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="786" font-family="monospace" font-size="13" fill="#c9d1d9">  ━━ 5/5 · 网络质量 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="805" font-family="monospace" font-size="13" fill="#c9d1d9">    ✓ IPv6 出口：2a04:4e41:24:57ea::29c1:57ea</text><text x="24" y="824" font-family="monospace" font-size="13" fill="#c9d1d9">    延迟 Cloudflare 1 ms</text><text x="24" y="843" font-family="monospace" font-size="13" fill="#c9d1d9">    延迟 Google     1 ms</text><text x="24" y="862" font-family="monospace" font-size="13" fill="#c9d1d9">    延迟 百度       失败</text><text x="24" y="881" font-family="monospace" font-size="13" fill="#c9d1d9">    下载 Cloudflare 108.4 Mbps</text><text x="24" y="900" font-family="monospace" font-size="13" fill="#c9d1d9">    下载 CacheFly   64.6 Mbps</text><text x="24" y="919" font-family="monospace" font-size="13" fill="#c9d1d9"> </text><text x="24" y="938" font-family="monospace" font-size="13" fill="#c9d1d9">  ━━ 体检总结 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text><text x="24" y="957" font-family="monospace" font-size="13" fill="#c9d1d9">    → IP 比较干净：适合账号类、出海业务。</text><text x="24" y="976" font-family="monospace" font-size="13" fill="#c9d1d9">    → 流媒体/AI 解锁良好，拿来看剧或跑 AI 没压力。</text><text x="24" y="995" font-family="monospace" font-size="13" fill="#c9d1d9"> </text>
